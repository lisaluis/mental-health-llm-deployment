services:
  - type: web
    name: mental-health-llm-demo
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BASE_MODEL_ID
        value: Qwen/Qwen2.5-1.5B-Instruct
      - key: SFT_ADAPTER_PATH
        value: ./models/qwen_qlora_sft_100
      - key: ORPO_ADAPTER_PATH
        value: ./models/qwen_orpo_adapter
